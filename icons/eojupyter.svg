<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>eojupyter — Eye of Jupyter</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2f6"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7a24a"/>
      <stop offset="0.5" stop-color="#f37726"/>
      <stop offset="1" stop-color="#e0601a"/>
    </linearGradient>
    <radialGradient id="shade" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#000000" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.32"/>
    </radialGradient>
    <clipPath id="eye">
      <path d="M24 128 Q128 34 232 128 Q128 222 24 128 Z"/>
    </clipPath>
    <clipPath id="iris">
      <circle cx="128" cy="128" r="50"/>
    </clipPath>
  </defs>

  <!-- App tile -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)" stroke="#d0d7de" stroke-width="3"/>

  <!-- Moons -->
  <circle cx="54" cy="54" r="10" fill="#8c959f"/>
  <circle cx="204" cy="60" r="7" fill="#8c959f"/>
  <circle cx="62" cy="206" r="6" fill="#8c959f"/>

  <!-- Eye white -->
  <path d="M24 128 Q128 34 232 128 Q128 222 24 128 Z" fill="#ffffff"/>

  <!-- Iris: banded Jupiter -->
  <g clip-path="url(#eye)">
    <g clip-path="url(#iris)">
      <rect x="70" y="70" width="116" height="116" fill="#ead2ac"/>
      <rect x="70" y="80" width="116" height="10" fill="#c78a56"/>
      <rect x="70" y="96" width="116" height="7" fill="#f4e4c8"/>
      <rect x="70" y="108" width="116" height="12" fill="#b9733f"/>
      <rect x="70" y="138" width="116" height="12" fill="#c98f5c"/>
      <rect x="70" y="156" width="116" height="7" fill="#f4e4c8"/>
      <rect x="70" y="168" width="116" height="10" fill="#b06a38"/>
      <ellipse cx="152" cy="150" rx="11" ry="6.5" fill="#cf4f2f"/>
      <circle cx="128" cy="128" r="50" fill="url(#shade)"/>
    </g>
    <circle cx="128" cy="128" r="50" fill="none" stroke="#5c3b22" stroke-width="3" stroke-opacity="0.55"/>
    <!-- Pupil -->
    <circle cx="128" cy="128" r="19" fill="#1f2328"/>
    <circle cx="117" cy="116" r="7" fill="#ffffff" opacity="0.92"/>
    <circle cx="138" cy="139" r="3" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Jupyter-orange lids -->
  <path d="M24 128 Q128 34 232 128 Q128 66 24 128 Z" fill="url(#lid)"/>
  <path d="M24 128 Q128 222 232 128 Q128 190 24 128 Z" fill="url(#lid)"/>
</svg>
