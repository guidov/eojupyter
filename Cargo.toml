[package]
name = "eojupyter"
version = "0.1.0"
edition = "2021"
description = "Fast, read-only, light-mode IDE-style Jupyter notebook viewer"

[dependencies]
ammonia = "4"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
latex2mathml = "0.2"
percent-encoding = "2"
png = "0.18"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "dump-load", "html", "parsing", "regex-fancy"] }
tao = "0.37"
tiny_http = "0.12"
wry = "0.57"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
